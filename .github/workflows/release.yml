name: Release

on:
  release:
    types: [published]

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Get version
        id: version
        uses: home-assistant/actions/helpers/version@master

      # The version helper reports the tag verbatim ("v3.1.4"), while
      # manifest.json carries a bare semver ("3.1.4"). Normalise once so the
      # check below and the manifest rewrite both use the same form.
      - name: "Resolve version"
        id: resolved
        run: |
          RAW="${{ steps.version.outputs.version }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      # HACS installs this repository from source, not from the release asset,
      # so the committed manifest version is what users actually see. Fail the
      # release rather than shipping a version that disagrees with the tag.
      - name: "Check manifest version matches the tag"
        run: |
          MANIFEST_VERSION=$(python3 -c "import json;print(json.load(open('custom_components/pgnig_gas_sensor/manifest.json'))['version'])")
          TAG_VERSION="${{ steps.resolved.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json says $MANIFEST_VERSION but the release tag is $TAG_VERSION."
            echo "::error::Bump \"version\" in custom_components/pgnig_gas_sensor/manifest.json to $TAG_VERSION and re-run the release."
            exit 1
          fi
          echo "manifest.json version $MANIFEST_VERSION matches tag $TAG_VERSION"

      - name: "Set manifest version number"
        run: |
          python3 ${{ github.workspace }}/.github/scripts/update_hacs_manifest.py --version ${{ steps.resolved.outputs.version }}

      - name: Create zip
        run: |
          cd custom_components/pgnig_gas_sensor
          zip pgnig_gas_sensor.zip -r ./
      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./custom_components/pgnig_gas_sensor/pgnig_gas_sensor.zip
          asset_name: pgnig_gas_sensor.zip
          tag: ${{ github.ref }}
          overwrite: true